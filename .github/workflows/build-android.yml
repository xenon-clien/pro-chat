name: Build ProChat Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout repository ──────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─── 2. Setup Node.js ────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ─── 3. Setup Java 17 (Temurin) ──────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ─── 4. Setup Android SDK Tools ──────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ─── 5. Accept SDK Licenses & Install SDK 35 ─────────
      - name: Accept Licenses & Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true

      # ─── 6. Setup Gradle with official action ────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ─── 7. Install Client Dependencies ──────────────────
      - name: Install Client Dependencies
        working-directory: client
        run: npm install

      # ─── 8. Build Web App ────────────────────────────────
      - name: Build Web App
        working-directory: client
        run: npm run build

      # ─── 9. Capacitor Sync Android ───────────────────────
      - name: Capacitor Sync Android
        working-directory: client
        run: npx cap sync android

      # ─── 10. Build Debug APK with Gradle ─────────────────
      - name: Build Debug APK with Gradle
        working-directory: client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ─── 11. Upload APK Artifact ─────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProChat-Android-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ─── 12. Create GitHub Release ───────────────────────
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ProChat Android v1.0.${{ github.run_number }}
          body: |
            ## 📱 ProChat Native Android App
            
            ### Download & Installation
            1. Download `app-debug.apk` below
            2. Open on your Android phone and install
            3. Enjoy full native ProChat app! 🎉
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

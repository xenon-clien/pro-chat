name: Build ProChat Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout repository ──────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─── 2. Setup Java 21 (Temurin JDK) ──────────────────
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ─── 3. Setup Android SDK 35 ─────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      # ─── 4. Setup Node.js 22 ─────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ─── 5. Install Client Dependencies ──────────────────
      - name: Install Client Dependencies
        working-directory: client
        run: npm install

      # ─── 6. Build Web App ────────────────────────────────
      - name: Build Web App
        working-directory: client
        run: npm run build

      # ─── 7. Capacitor Sync Android ───────────────────────
      - name: Capacitor Sync Android
        working-directory: client
        run: npx cap sync android

      # ─── 8. Build Debug APK with Gradle ──────────────────
      - name: Build Debug APK with Gradle
        working-directory: client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --info

      # ─── 9. Upload APK Artifact ──────────────────────────
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProChat-Android-APK
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ─── 10. Create GitHub Release ───────────────────────
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ProChat Android v1.0.${{ github.run_number }}
          body: |
            ## 📱 ProChat Native Android App
            
            ### Download & Installation
            1. Download `app-debug.apk` below
            2. Open on your Android phone and install
            3. Enjoy full native ProChat app! 🎉
          files: client/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
